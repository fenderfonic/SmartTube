name: Personal Android TV signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout reviewed source and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up independent signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SMARTTUBE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SMARTTUBE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMARTTUBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMARTTUBE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure the four SMARTTUBE_* secrets first"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/personal-release.jks"
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/personal-release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:assembleStbetaRelease
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find smarttubetv/build/outputs/apk/stbeta/release -name '*_universal.apk' -type f -print -quit)
          test -n "$APK" && test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='dev.fenderfonic.smarttube'"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK"
      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a2 # v7.0.1
        with:
          name: smarttube-personal-signed-${{ github.run_number }}
          path: smarttubetv/build/outputs/apk/stbeta/release/*_universal.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        run: rm -f personal-release.jks keystore.properties
