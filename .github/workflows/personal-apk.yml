name: Personal Android TV test APK
on:
  pull_request:
    branches: [master, feat/discover-self-drive, feat/discover-v2]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout pinned source and submodules
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify Discover curator
        run: python3 -m unittest discover -s curator/tests -v
      - name: Verify Discover Android selection and cache
        run: bash gradlew --no-daemon :common:testStbetaDebugUnitTest --tests '*Discovery*Test'
      - name: Upload Discover Android test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discover-tests-${{ github.run_number }}
          path: |
            common/build/reports/tests/testStbetaDebugUnitTest/
            common/build/test-results/testStbetaDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Build test APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:assembleStbetaDebug
      - name: Verify APK and package ID
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find smarttubetv/build/outputs/apk/stbeta/debug -name '*_universal.apk' -type f -print -quit)
          test -n "$APK" && test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='dev.fenderfonic.smarttube'"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'adnada'"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK"
      - name: Upload universal test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smarttube-personal-test-${{ github.run_number }}
          path: smarttubetv/build/outputs/apk/stbeta/debug/*_universal.apk
          if-no-files-found: error
          retention-days: 14
